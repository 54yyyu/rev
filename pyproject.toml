[project]
name = "rev"
version = "0.2.0"
description = "Typed decisions from a frozen open model, one forward pass, on Apple Silicon"
requires-python = ">=3.10"
# The base install is enough for `rev serve --upstream URL` and `Client` on any
# machine (the relay host is an aarch64 Linux box with no GPU). The in-process
# engine needs MLX, which only exists on Apple Silicon: `.[mlx]`.
# jinja2 renders the chat template; transformers imports it lazily and does not
# depend on it, so it must be listed here.
dependencies = ["numpy>=1.26", "huggingface-hub>=0.28", "transformers>=4.45", "jinja2>=3.1"]

[project.optional-dependencies]
mlx = ["mlx>=0.29", "mlx-lm>=0.28"]
# bench/usecases.py reads this Mac's calendar and mail through pyapple, which is
# found at ~/Documents/projects/pyapple-mcp; these are what its readers import.
bench = ["pyobjc-framework-EventKit>=10.0", "pyobjc-framework-Cocoa>=10.0"]

[project.scripts]
rev = "rev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rev"]
